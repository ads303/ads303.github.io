<div class="publication-covers">
{% for p in include.publications %}
{% if p.image or p.cover_label %}
<a class="publication-cover" href="#{{ p.id }}">
  <span class="publication-cover__image">
  {% if p.image %}
    <img src="{{ p.image }}" alt="{{ p.image_alt | escape }}" loading="lazy" width="300" height="340">
  {% else %}
    <span class="publication-cover__typeset" aria-hidden="true"><span>{{ p.venue }}</span><strong>{{ p.cover_label }}</strong><span>DNA methylation<br>&amp; gene expression</span></span>
  {% endif %}
  </span>
  <span class="publication-cover__caption"><strong>{{ p.short_title | default: p.title | escape }}</strong><span>{{ p.venue | escape }} · {{ p.year }}</span></span>
</a>
{% endif %}
{% endfor %}
</div>
