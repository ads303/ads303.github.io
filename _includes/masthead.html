{% include base_path %}
<header class="masthead">
  <div class="masthead__inner-wrap site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ site.title }}</a>
    <nav class="site-navigation" aria-label="Main navigation">
      <ul>
        {% for link in site.data.navigation.main %}
        <li><a href="{% if link.url contains 'http' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
